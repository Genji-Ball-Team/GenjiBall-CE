name: Release

# Push a tag like v1.3.2 or v1.3.2T to publish a GitHub release
# with the compiled Workshop code attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package Workshop code
        run: cp workshop/genjiball.txt "genjiball-${GITHUB_REF_NAME}.txt"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "genjiball-${GITHUB_REF_NAME}.txt" \
            --title "Genji Ball CE $GITHUB_REF_NAME" \
            --generate-notes \
            --target "$GITHUB_SHA"
