name: Release

# Push a tag like 1.3.3 or 1.3.3T to publish a GitHub release with the
# compiled Workshop code attached. Tags have no "v" so they don't clash
# with the version branches (v1.3.3, v1.3.3T, ...).
on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package Workshop code
        run: cp workshop/genjiball.txt "genjiball-v${GITHUB_REF_NAME}.txt"
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-pushed tag keeps its existing release (and hand-written notes);
          # only the attached Workshop code is replaced.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "genjiball-v${GITHUB_REF_NAME}.txt" --clobber
          else
            # Player-facing notes from docs/releases/ if this version has them.
            notes="docs/releases/v${GITHUB_REF_NAME}.md"
            if [ -f "$notes" ]; then
              notes_args=(--notes-file "$notes")
            else
              notes_args=(--generate-notes)
            fi
            # A variant (tag ending in a letter, like 1.3.3T) never replaces the
            # free-for-all release as "Latest".
            latest_args=()
            if [[ "$GITHUB_REF_NAME" =~ [A-Za-z]$ ]]; then
              latest_args=(--latest=false)
            fi
            gh release create "$GITHUB_REF_NAME" "genjiball-v${GITHUB_REF_NAME}.txt" \
              --title "Genji Ball CE v$GITHUB_REF_NAME" \
              "${notes_args[@]}" "${latest_args[@]}" \
              --verify-tag
          fi
